name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/buddy.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/buddy.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=germanbuddy-key-2026" >> "$GITHUB_ENV"
          fi
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: german-buddy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
